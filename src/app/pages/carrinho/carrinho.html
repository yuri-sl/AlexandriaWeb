<app-navbar>
</app-navbar>
<div class="container">

<div class="left-container">

<div class="titulo">
    <h1>Meu carrinho</h1>
    <span>5 exemplares</span>
</div>


@for (item of listaCarrinho; track $index) {
    <div class="produto-grid">
        <div class="produto">
            <div class="card-info-texto">
                <h3>{{item.titulo}}</h3>
                <p>{{item.autor}}</p>
            </div>
            <div class="card-right">
                <input type="number" min="1" max="10" [value]="item.quantidade" (input)="item.quantidade = $any($event.target).valueAsNumber">
                <label>{{atualizarValor(item)}}</label>
                <a>remover</a>
            </div>
        </div>
    </div>
}

<div class="produto-grid">
    <div class="entrega">
        <h2>Entrega</h2>
        <div class="entrega-opcoes">
            <button [class.selected]="entregaValida('correios')" (click)="alternarEntrega('correios')">Correio Grátis</button>
            <button [class.selected]="entregaValida('expresso')" (click)="alternarEntrega('expresso')">Expresso</button>
        </div>
    </div>
</div>

<div class="pagamento">
    <h2>Pagamento</h2>
    <div class="pagamento-opcoes">
        <div class="forma-pagamento-credito">
            <input type="radio">Cartão de Credito
        </div>
        <div class="forma-pagamento-pix" style="justify-content: space-between;">
            <input type="radio">Pix
            <label>5% desconto</label>
        </div>
        <div class="forma-pagamento-boleto">
            <input type="radio">Boleto
        </div>
    </div>
</div>
</div>

<div class="right-container">
    <section class="resumo-compras">
        <h1 class="kpi-glyph">RESUMO</h1>
        <div class="resumo-compra">
            <div style="display: flex; justify-content: space-between; font-size: 14px;">
                <label>
                    Subtotal (3 obras)
                </label>
                <label>Correios</label>
                <label>Desconto de estudante (10%)</label>
                <label>R$ 920,00</label>
                <label>Grátis</label>
                <label>- R$ 92,00</label>
                <div style="display: flex; flex-direction: row;">
                    <input>
                    <button>Aplicar</button>
                </div>
                <div style="display: flex; flex-direction: row;">
                    <label class="kpi-glyph">Total</label>
                    <h2 class="kpi-glyph">R$ 828,00</h2>
                </div>
                <button>Finalizar Compra</button>
            <div class="valor-compra">
                <label>R$ 920,00</label>
                <label>Grátis</label>
                <label>- R$ 92,00</label>
                <div style="display: flex; flex-direction: row;">
                    <input>
                    <button>Aplicar</button>
                </div>
                <div style="display: flex; flex-direction: row;">
                    <label class="kpi-glyph">Total</label>
                    <h2 class="kpi-glyph">R$ 828,00</h2>
                </div>
                <button>Finalizar Compra</button>
            </div>
            </div>
        </div>
    </section>
</div>
</div>
