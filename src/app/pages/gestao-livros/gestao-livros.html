<div class="header">
    <div class="left">
        <span class="p-input-icon-left search-input">
            <i class="pi pi-search"></i>
            <input
                pInputText
                type="text"
                placeholder="Pesquisar..."
                [(ngModel)]="termoPesquisa"
                (keypress)="habilitarAdicionarModal()"
            >
        </span>
    </div>
    <div class="right">
        <p-button
            label="adicionar livro"
            [rounded]="true"
            (onClick)="habilitarAdicionarModal()"
        >
        </p-button>
            <p-paginator 
            (onPageChange)="onPageChange($event)" 
            [first]="first" 
            [rows]="rows" 
            [totalRecords]="120" 
            [rowsPerPageOptions]="[10, 20, 30]">
            </p-paginator>
    </div>
</div>

<p-table [value]="listaLivros">
    <ng-template #header>
        <tr>
            <th>Id</th>
            <th>Título</th>
            <th>Descrição</th>
            <th>Autor</th>
            <th>Preço</th>
            <th>Gênero</th>
            <th>Estoque</th>
            <th>Preço Atualizado</th>
            <th colspan="2">Ações</th>


        </tr>
    </ng-template>

    <ng-template #body let-livro>
        <tr>
            <td>{{ livro.id }}</td>
            <td>{{ livro.titulo }}</td>
            <td>{{ livro.descricao }}</td>
            <td>{{ livro.autor }}</td>
            <td>{{ livro.preco }}</td>
            <td>{{ livro.genero }}</td>
            <td>{{ livro.estoque }}</td>
            <td>{{ livro.precoAtualizado }}</td>
            <td>
                <p-button label="Editar livro"
                    (onClick)="habilitarEdicaoModal(livro.id)"
                >
                </p-button>
                <p-button
                    icon="pi pi-trash"
                    severity="danger"
                    [rounded]="true"
                    [text]="true"
                    label="deletar"
                    (onClick)="deletarLivro(livro.id)"
                    >
                </p-button>
            </td>
        </tr>
    </ng-template>
</p-table>






<p-dialog
    [(visible)]="visualizarModal"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '60vw' }"
    [breakpoints]="{ '960px': '80vw', '640px': '95vw' }"
    [header]="modoEdicao ? 'Editar Livro' : 'Adicionar Livro'">

    <div class="dialog-content">
        <div class="left">
            <div class="form-livro">
                <form [formGroup]="formLivro" (ngSubmit)="enviarFormulario()">
                    <div class="campo">
                        <label for="titulo">Título</label>
                        <input
                            pInputText
                            id="titulo"
                            formControlName="titulo"
                        >
                    </div>

                    <div class="campo">
                        <label for="autor">Autor</label>
                        <input
                            pInputText
                            id="autor"
                            formControlName="autor"
                        >
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input
                            pInputText
                            id="descricao"
                            formControlName="descricao"
                        >
                    </div>

                    <div class="campo">
                        <label for="genero">Gênero</label>
                        <input
                            pInputText
                            id="genero"
                            formControlName="genero"
                        >
                    </div>

                    <div class="action-buttons">
                        <p-button 
                            label="Cancelar"
                            icon="pi pi-times"
                            (onClick)="fecharModal()"
                        ></p-button>

                        <p-button 
                            [label]="modoEdicao ? 'Salvar Alterações' : 'Adicionar'"
                            icon="pi pi-check"
                            type="submit"
                        ></p-button>    
                    </div>
                </form>
            </div>
        </div>

        <div class="right">
            <p-button 
                label="Fazer upload de imagem"
                icon="pi pi-upload"
            ></p-button>
        </div>
    </div>

</p-dialog>
