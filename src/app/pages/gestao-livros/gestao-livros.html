<p>gestao-livros works!</p>


<p-button
    label="adicionar livro"
    [rounded]="true"
    (onClick)="habilitarAdicionarModal()"
>
</p-button>

<p-table [value]="listaLivros">
    <ng-template #header>
        <tr>
            <th>Id</th>
            <th>Título</th>
            <th>Descrição</th>
            <th>Autor</th>
            <th>Preço</th>
            <th>Gênero</th>
            <th>Estoque</th>
            <th>Preço Atualizado</th>
            <th colspan="2">Ações</th>


        </tr>
    </ng-template>

    <ng-template #body let-livro>
        <tr>
            <td>{{ livro.id }}</td>
            <td>{{ livro.titulo }}</td>
            <td>{{ livro.descricao }}</td>
            <td>{{ livro.autor }}</td>
            <td>{{ livro.preco }}</td>
            <td>{{ livro.genero }}</td>
            <td>{{ livro.estoque }}</td>
            <td>{{ livro.precoAtualizado }}</td>
            <td>
                <p-button label="Editar livro"
                    (onClick)="habilitarEdicaoModal(livro.id)"
                >
                </p-button>
                <p-button
                    icon="pi pi-trash"
                    severity="danger"
                    [rounded]="true"
                    [text]="true"
                    label="deletar"
                    (onClick)="deletarLivro(livro.id)"
                    >
                </p-button>
            </td>
        </tr>
    </ng-template>
</p-table>






<p-dialog
    [(visible)]="visualizarModal"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [header]="modoEdicao ? 'Editar Livro' : 'Adicionar Livro'">
    <div class="form-livro">
        <form [formGroup]="formLivro" (ngSubmit)="enviarFormulario()">
            <label for="titulo">Título</label>
            <input
                pInputText
                id="titulo"
                formControlName="titulo"
            >
            <label for="autor">Autor</label>
            <input
                pInputText
                id="autor"
                formControlName="autor"
            >
            <label for="descricao">Descrição</label>
            <input
                pInputText
                id="descricao"
                formControlName="descricao"
            >

            <label for="genero">Gênero
            </label>
            <input
                pInputText
                id="genero"
                formControlName="genero"
            >



            <p-button 
                [label]="modoEdicao? 'Salvar Alterações' : 'Adicionar'"
                icon="pi pi-check"
                type="submit"
            ></p-button>

            <p-button 
                label="Cancelar"
                icon="pi pi-cross"
                (onClick)="fecharModal()"
            ></p-button>
        </form>
    </div>

</p-dialog>
